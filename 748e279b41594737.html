<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kalėdų dovana</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#d6c7bb}
body{display:grid;place-items:center;font-family:Georgia,serif}
.phone{width:100%;max-width:calc(100dvh * .62);height:100vh;height:100dvh;position:relative;overflow:hidden;isolation:isolate;background:#d9cec4}
canvas{position:absolute;inset:0;width:100%;height:100%}
button{position:absolute;left:50%;top:max(8%,calc(env(safe-area-inset-top) + 18px));transform:translateX(-50%);z-index:6;border:1px solid #d2a65d;border-radius:30px;background:linear-gradient(160deg,#b02b2b,#7e171c);color:#fff6e5;white-space:nowrap;font:600 clamp(16px,4.6vw,20px) Georgia,serif;padding:15px 26px;box-shadow:0 6px 20px #6e241e30;cursor:pointer;transition:opacity .55s,transform .55s}
button:focus-visible{outline:3px solid #e9c484;outline-offset:4px}
button:disabled{cursor:default}
button.used{opacity:0;transform:translate(-50%,-10px);pointer-events:none}
.reveal-layer{position:absolute;inset:0;pointer-events:none;z-index:4}
.box-glow{position:absolute;left:var(--bx);top:var(--by);width:84px;height:84px;transform:translate(-50%,-50%);background:radial-gradient(circle,#ffe39a 0%,#ffd06477 42%,transparent 72%);filter:blur(6px);opacity:0}
.reveal-layer.active .box-glow{animation:glowPulse 1.15s ease-out both}
@keyframes glowPulse{0%{opacity:0;transform:translate(-50%,-50%) scale(.25)}30%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.4)}}
.confetti{position:absolute;left:var(--bx);top:var(--by);width:10px;height:16px;border-radius:2px;opacity:0;transform:translate(-50%,-50%);animation:confettiBurst 1.45s cubic-bezier(.15,.7,.2,1) forwards;animation-delay:var(--delay)}
.confetti.c1{background:#f6c94c} .confetti.c2{background:#c93333} .confetti.c3{background:#ffffff} .confetti.c4{background:#e99e2a} .confetti.c5{background:#9b1c1c}
@keyframes confettiBurst{0%{opacity:0;transform:translate(-50%,-50%) translate(0,0) rotate(0deg) scale(.3)}10%{opacity:1}100%{transform:translate(-50%,-50%) translate(var(--x),var(--y)) rotate(var(--r)) scale(1);opacity:0}}
.name-pop{position:absolute;left:var(--bx);top:var(--nameY);transform:translate(-50%,-50%) scale(.15);opacity:0;z-index:5;pointer-events:none;white-space:nowrap;color:#8b1f25;font:700 var(--name-size,28px)/1.1 Georgia,serif;letter-spacing:.01em;text-shadow:0 1px 1px #fff8e8,0 2px 8px #fff6e4aa}
.name-pop.show{animation:nameRise .85s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes nameRise{0%{opacity:0;transform:translate(-50%,0) scale(.15)}18%{opacity:1}65%{opacity:1;transform:translate(-50%,calc(-1 * var(--rise) - 8px)) scale(1.06)}100%{opacity:1;transform:translate(-50%,calc(-1 * var(--rise))) scale(1)}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
@media(prefers-reduced-motion:reduce){.confetti,.box-glow{display:none} .name-pop.show{animation-duration:.01s;animation-delay:0s}}

.budget-ticker{position:absolute;left:0;right:0;bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:5;overflow:hidden;white-space:nowrap;visibility:hidden;pointer-events:none;color:#8b1f25;font:600 clamp(16px,4.8vw,21px)/1.5 Georgia,serif;text-shadow:0 1px 2px #fff4df;}
.budget-ticker.show{visibility:visible;}
.budget-text{display:block;width:max-content;padding-left:0;transform:translateX(var(--ticker-width,100vw));}
.budget-ticker.show .budget-text{animation:budgetScroll 8s linear infinite;}
@keyframes budgetScroll{from{transform:translateX(var(--ticker-width,100vw));}to{transform:translateX(-100%);}}
@media(prefers-reduced-motion:reduce){.budget-ticker.show .budget-text{animation:none;transform:none;width:100%;text-align:center;}}
</style>
</head>
<body>
<main id="phone" class="phone">
  <canvas id="scene" role="img" aria-label="Raudona kalėdinė dovana"></canvas>
  <button id="open" type="button" disabled>Atidaryti dovaną</button>
  <div id="reveal" class="reveal-layer" aria-hidden="true">
    <div class="box-glow"></div>
  </div>
  <div id="namePop" class="name-pop" aria-hidden="true">Justė</div>
  <div id="budgetTicker" class="budget-ticker" aria-hidden="true"><span class="budget-text">Dovaną perkame už 20 eurų</span></div>
  <p id="status" class="sr" role="status"></p>
</main>

function resize(){W=phone.clientWidth;H=phone.clientHeight;phone.style.setProperty('--ticker-width',W+'px');const dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(canvas.width/W,0,0,canvas.height/H,0,0);if(ready)paint(current)}
function paint(i){current=i;S=W;X=0;Y=H*.65-S*.87;const bottom=Y+S;const im=imgs[i],base=imgs[0];ctx.fillStyle='#d9cec4';ctx.fillRect(0,0,W,H);
if(Y>0){ctx.save();ctx.beginPath();ctx.rect(0,0,W,Y);ctx.clip();for(let y=Y,flip=true;y>0;flip=!flip){const h=S*100/414;ctx.save();ctx.translate(0,y);if(flip)ctx.scale(1,-1);ctx.drawImage(base,0,0,414,100,0,flip?0:-h,W,h);ctx.restore();y-=h}ctx.restore()}
if(bottom<H){const h=S*36/414;ctx.save();ctx.beginPath();ctx.rect(0,bottom,W,H-bottom);ctx.clip();for(let y=bottom,k=0;y<H;y+=h,k++){ctx.save();ctx.translate(0,y);if(k%2===0){ctx.translate(0,h);ctx.scale(1,-1)}ctx.drawImage(base,0,378,414,36,0,0,W,h);ctx.restore()}ctx.restore()}
ctx.drawImage(im,X,Y,S,S);
GX=W*.30; GY=Y+S*.64; NAMEY=Y+S*.63;
phone.style.setProperty('--bx',GX+'px');
phone.style.setProperty('--by',GY+'px');
phone.style.setProperty('--nameY',NAMEY+'px');
phone.style.setProperty('--name-size',Math.min(30,W*.073)+'px');
phone.style.setProperty('--rise',W*.24+'px');
}
function burstConfetti(){const colors=['c1','c2','c3','c4','c5'];for(let i=0;i<42;i++){const c=document.createElement('i');c.className='confetti '+colors[i%colors.length];const angle=(-95 + Math.random()*190) * Math.PI/180;const dist=45 + Math.random()*130;const x=Math.cos(angle)*dist;const y=Math.sin(angle)*dist - 30 - Math.random()*55;c.style.setProperty('--x',x.toFixed(1)+'px');c.style.setProperty('--y',y.toFixed(1)+'px');c.style.setProperty('--r',(-260+Math.random()*520).toFixed(0)+'deg');c.style.setProperty('--delay',(Math.random()*0.18).toFixed(2)+'s');reveal.appendChild(c)}}
function revealName(){canvas.setAttribute('aria-label','Juodas kačiukas prie atidarytos dovanos');reveal.classList.add('active');burstConfetti();namePop.classList.add('show');namePop.setAttribute('aria-hidden','false');status.textContent='Justė';setTimeout(()=>{const ticker=document.getElementById('budgetTicker');ticker.classList.add('show');ticker.setAttribute('aria-hidden','false');},900);}
function play(){const start=performance.now(),total=durations.reduce((a,b)=>a+b,0);function tick(now){const elapsed=now-start;let end=0,index=0;for(;index<durations.length-1;index++){end+=durations[index];if(elapsed<end)break}if(index!==current)paint(index);if(elapsed<total)requestAnimationFrame(tick);else{paint(imgs.length-1);revealName()}}requestAnimationFrame(tick)}
Promise.all(imgs.map(im=>im.decode())).then(()=>{ready=true;resize();btn.disabled=false}).catch(()=>{status.textContent='Nepavyko įkelti animacijos.'});
window.addEventListener('resize',resize);
btn.addEventListener('click',()=>{if(!ready||started)return;started=true;btn.disabled=true;btn.classList.add('used');setTimeout(play,3000)});
</script>
</body>
